# Home Assistant add-on manifest.
# Reference: https://developers.home-assistant.io/docs/add-ons/configuration/

name: Cisco Home Console Max
version: "0.3.2"
slug: cisco_home_console_max
description: >-
  Turn Cisco desk phones into Home Assistant control panels, with live house
  status on the screen and on the BLF lamps.
url: https://github.com/maxluka/cisco-home-console-max
stage: experimental

arch:
  - amd64
  - aarch64

# The base image (ghcr.io/home-assistant/*-base) carries its own S6-overlay v3
# init as PID 1. Supervisor's default (init: true) wraps the container in
# Docker's own init instead, which pushes S6 out of PID 1 and it refuses to
# start: "s6-overlay-suexec: fatal: can only run as pid 1". Required false
# whenever the base image supplies its own init — see the developer docs.
init: false

# Supervisor proxies the Home Assistant REST API at http://supervisor/core/api,
# so the user never has to create or paste a long-lived access token.
homeassistant_api: true

# The phone-to-entity mapping is too complex for the options schema
# (key families, extension ranges, rooms, scenes). HA's own guidance is to take
# it as a file. Lives at /config/cisco-home-console.yaml inside the container.
#
# Deliberately `config`, not `addon_config` (or its 2026.07+ rename,
# `app_config`): those map to a folder private to this add-on, invisible to
# everything else, which is exactly wrong once a companion HA integration
# needs to read/write the same file to drive its picker-based config UI.
# `config` maps HA's real config directory in at the same internal /config
# path, so both sides reach one file. (`addon_config` was the original
# choice, on HA's own general advice for config too complex for the options
# schema — right instinct for isolation, wrong once a second component
# needs the file too.)
map:
  - config:rw

# Phones fetch XML over plain HTTP with no auth and cannot use ingress,
# so a real LAN-reachable port is required.
ports:
  8000/tcp: 8000
ports_description:
  8000/tcp: >-
    XML service the phones fetch their menus from. Must be reachable from the
    phones on your LAN.

watchdog: "http://[HOST]:[PORT:8000]/health"

# Simple settings: Supervisor renders these as a settings form automatically.
options:
  asterisk_host: ""
  asterisk_ami_port: 5038
  asterisk_ami_user: ""
  asterisk_ami_password: ""
  bridge_token: ""
  config_file: cisco-home-console.yaml
  log_level: info

schema:
  asterisk_host: str
  asterisk_ami_port: port
  asterisk_ami_user: str
  asterisk_ami_password: password
  bridge_token: str
  config_file: str
  log_level: list(trace|debug|info|warning|error)
