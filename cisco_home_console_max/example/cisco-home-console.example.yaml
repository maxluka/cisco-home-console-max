# Cisco Home Console Max — house file
#
# Copy this to the add-on config directory as `cisco-home-console.yaml`
# (Settings -> Add-ons -> Cisco Home Console Max -> Configuration names the
# file; the directory is /addon_configs/<slug>/ on the host).
#
# Everything specific to YOUR home lives here: which lights make a room, which
# sensors sit behind a lamp, which scenes deserve a key. The add-on settings
# form only holds connection details.
#
# The format is deliberately plain YAML — no anchors, no templates — so it can
# be written by hand or generated by tooling (a script, or an assistant with
# an MCP server that can read your entity list and write this file).
#
# Every section is optional. With an empty file the phone still gets generic
# Lights and Scenes menus straight from Home Assistant; the sections below add
# the curated parts: favorites, lamps, the dashboard.

timezone: Europe/Riga

# ── Dashboard ────────────────────────────────────────────────────────────────
# The idle screen shows four climate readings, the active scene, a clock, and
# one watch in the centre slot (typically the front door).

climate:
  home_temperature: sensor.living_room_temperature
  home_humidity: sensor.living_room_humidity
  outdoor_temperature: sensor.balcony_temperature
  outdoor_humidity: sensor.balcony_humidity

dashboard:
  door_watch: entrance          # a key from `watch` below
  door_quiet: "Door locked"     # shown small and grey when all is well
  door_alert: "DOOR UNLOCKED"   # shown loud when the watch wants attention

# ── Favorites ────────────────────────────────────────────────────────────────
# The curated scene list on its own screen, in this order.
#
# `active_helper` (optional) is an input_boolean that YOUR automations own:
# starting the favorite turns that helper on and every other favorite's helper
# off, and the automations behind the helper run the actual scene. This is
# what makes "which scene is active" answerable — a scene entity's own state
# is only the moment it was last applied. Without a helper the entity is run
# directly and never reported as active.
#
# `key` (optional, requires active_helper) also gives the favorite a BLF lamp:
# Custom:home_scene_<key> in Asterisk.

favorites:
  - name: Bright
    entity: scene.open_space_bright
    active_helper: input_boolean.bright_active
    key: bright
  - name: Evening
    entity: scene.open_space_evening
    active_helper: input_boolean.evening_active
    key: evening
  - name: Movie night
    entity: script.movie_night_on

# ── Rooms ────────────────────────────────────────────────────────────────────
# One lamp per room: lit when any of its lights is on. Pressing the key
# toggles — `bright`/`dark` scripts when given (they carry your colour
# temperature and choreography), plain light.turn_on/off otherwise.
# Lamp name in Asterisk: Custom:home_room_<key>.
#
# Name the lights one of two ways:
#
#   area:   a Home Assistant area id. Membership is read from HA's own
#           registry while running, so adding a lamp to that room in Home
#           Assistant is enough — nothing here needs re-saving. Lights count
#           whether they sit in the area directly or through their device,
#           which is how most bulbs are actually placed.
#   lights: an explicit list, for a group that isn't an area.
#
# Give both and they add up, which covers "this room, plus the lamp in the
# hall outside it". A room needs at least one of the two.

rooms:
  # Live area membership: the usual choice.
  - key: kitchen
    name: Kitchen
    area: kitchen
  # An area plus one extra light that lives elsewhere.
  - key: office
    name: Office
    area: office
    lights:
      - light.hall_spot_outside_office
    bright: script.office_bright_on
    dark: script.office_all_off
  # No area, just a list.
  - key: wardrobe
    name: Wardrobe
    lights:
      - light.wardrobe_spot_1
      - light.wardrobe_spot_2

# ── Watch ────────────────────────────────────────────────────────────────────
# Read-only lamps: lit when any listed entity wants attention (a contact reads
# `on` when open, a lock `unlocked`, a cover `open`). `lamp: RINGING` marks
# the urgent few apart from ordinary states. `inverted: true` turns the test
# over for the rare entity whose quiet state is the one worth reporting.
# Lamp name in Asterisk: Custom:home_watch_<key>.

watch:
  - key: entrance
    name: Entrance
    entities:
      - lock.front_door
      - binary_sensor.front_door_contact
    lamp: RINGING
  - key: windows
    name: Windows
    entities:
      - binary_sensor.office_window_contact
      - binary_sensor.bedroom_window_contact
  - key: leak
    name: Leak
    entities:
      - binary_sensor.bathroom_leak
      - binary_sensor.kitchen_leak
    lamp: RINGING

# ── Switches ─────────────────────────────────────────────────────────────────
# Plain on/off entities with a lamp each: lit when on, press to toggle.
# Works for any domain that answers homeassistant.turn_on/off, groups included.
# Lamp name in Asterisk: Custom:home_switch_<key>.

switches:
  - key: speakers
    name: Desk speakers
    entity: switch.desk_speakers

# ── Flows ────────────────────────────────────────────────────────────────────
# One scene per key with an explicit off: pressing the key that is already
# showing runs `stop` instead, so every flow key is also a way to darken the
# room. `active_helper` is what the lamp reads.
# Lamp name in Asterisk: Custom:home_flow_<key>.

flows:
  - key: office_cold
    name: Office Cold
    run: script.office_cold_bright_on
    stop: script.office_all_off
    active_helper: input_boolean.office_cold_active

# ── Lights menu ──────────────────────────────────────────────────────────────
# Entities (or prefixes) to leave off the Lights menu — devices that register
# as lights without being any, like a scene-controller pad.

hide_lights:
  - light.magic_pad_

# ── Phones ───────────────────────────────────────────────────────────────────
# Idle screens are fetched once and never refreshed by the phone, so the
# console pushes a refresh. `console_url` is this add-on's address as the
# phones reach it (a push has to be told; requests carry their own address).
# `quiet_hours` skips pushes while the phone's display is scheduled dark.

console_url: http://192.168.1.10:8000

phones:
  - address: 192.168.1.50
    push_interval: 300
    quiet_hours: "00:00-09:00"

# ── Auth ─────────────────────────────────────────────────────────────────────
# Device names allowed on /xml/auth; empty trusts the LAN.

auth_devices: []
